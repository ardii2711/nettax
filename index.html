<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0B1F3A" />
    <meta
      name="description"
      content="Nettax adalah kalkulator PPN dan PPh yang cepat, transparan, dan gratis. Hitung pajak dari nilai bruto atau cari nilai bruto dari target nilai bersih."
    />
    <title>Nettax — Kalkulator PPN &amp; PPh</title>
    <script>
      // Terapkan tema tersimpan sebelum render agar tidak ada flash terang.
      ;(function () {
        try {
          if (localStorage.getItem('nettax-theme') === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (error) {
          // localStorage tidak tersedia — pakai tema terang.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
